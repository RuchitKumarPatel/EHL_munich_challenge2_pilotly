[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-method5"
version = "0.1.0"
description = "Uncertainty-gated adaptive routing: MVT escalation ceiling, quality-driven selection, and exploration concentrated where it is informative."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-method4"
version = "0.1.0"
description = "Biologically-grounded routing: probability matching, marginal-value escalation, response-threshold specialization, and geometric-mean (bet-hedging) objectives, with stochastic-target off-policy evaluation."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

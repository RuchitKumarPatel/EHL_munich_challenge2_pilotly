[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-method1"
version = "0.1.0"
description = "Cache-aware model routing and offline policy evaluation for agent trajectories"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
demo = ["streamlit>=1.30"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]


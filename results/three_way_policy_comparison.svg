<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470">
<rect width="100%" height="100%" fill="#fbfaf7"/>
<text x="36.0" y="42.0" font-family="Arial, sans-serif" font-size="22" fill="#111827" text-anchor="start" font-weight="700">Three-way policy comparison</text>
<text x="36.0" y="66.0" font-family="Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="start" font-weight="400">Cost uses cache-aware estimated input tokens. Quality uses continuation-burden delta; lower is better.</text>
<rect x="90" y="100" width="600" height="250" fill="#ffffff" stroke="#d1d5db"/>
<line x1="90" y1="350.0" x2="690" y2="350.0" stroke="#eef2f7"/>
<text x="80.0" y="354.0" font-family="Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="end" font-weight="400">$0</text>
<line x1="90" y1="287.5" x2="690" y2="287.5" stroke="#eef2f7"/>
<text x="80.0" y="291.5" font-family="Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="end" font-weight="400">$22</text>
<line x1="90" y1="225.0" x2="690" y2="225.0" stroke="#eef2f7"/>
<text x="80.0" y="229.0" font-family="Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="end" font-weight="400">$43</text>
<line x1="90" y1="162.5" x2="690" y2="162.5" stroke="#eef2f7"/>
<text x="80.0" y="166.5" font-family="Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="end" font-weight="400">$65</text>
<line x1="90" y1="100.0" x2="690" y2="100.0" stroke="#eef2f7"/>
<text x="80.0" y="104.0" font-family="Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="end" font-weight="400">$86</text>
<rect x="170" y="126.8" width="115" height="223.2" fill="#111827" rx="6"/>
<text x="227.5" y="114.8" font-family="Arial, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">$76.93</text>
<text x="227.5" y="376.0" font-family="Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">Original</text>
<rect x="345" y="187.4" width="115" height="162.6" fill="#2563eb" rx="6"/>
<text x="402.5" y="175.4" font-family="Arial, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">$56.04</text>
<text x="402.5" y="376.0" font-family="Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">Gated λ=0.20</text>
<rect x="520" y="188.1" width="115" height="161.9" fill="#0f766e" rx="6"/>
<text x="577.5" y="176.1" font-family="Arial, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">$55.79</text>
<text x="577.5" y="376.0" font-family="Arial, sans-serif" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">Segment + switch penalty</text>
<text x="730.0" y="112.0" font-family="Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="700">Concrete recommendation</text>
<text x="730.0" y="140.0" font-family="Arial, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="400">Cache-aware segment router</text>
<text x="730.0" y="166.0" font-family="Arial, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="400">Use gated λ=0.20 as proposal</text>
<text x="730.0" y="192.0" font-family="Arial, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="400">Keep/switch per call segment</text>
<text x="730.0" y="218.0" font-family="Arial, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="400">Charge 2k-token switch penalty</text>
<text x="730.0" y="258.0" font-family="Arial, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Savings vs original: 27.48%</text>
<text x="730.0" y="284.0" font-family="Arial, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="400">Burden delta: -0.0089</text>
<text x="730.0" y="310.0" font-family="Arial, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="400">Switch penalty: $0.0485</text>
<text x="36.0" y="425.0" font-family="Arial, sans-serif" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Interpretation: the segment router keeps the gated quality guard, then avoids model switches unless cache-aware savings survive the switch penalty.</text>
</svg>
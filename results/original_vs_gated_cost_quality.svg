<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430">
<rect width="100%" height="100%" fill="#fbfaf7"/>
<text x="36.0" y="42.0" font-family="Arial, sans-serif" font-size="22" fill="#111827" text-anchor="start" font-weight="700">Original vs gated router: cost-quality comparison</text>
<text x="36.0" y="66.0" font-family="Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="start" font-weight="400">Cost is cache-aware estimated input cost. Quality is a continuation-burden proxy; lower burden is better.</text>
<rect x="90" y="100" width="470" height="230" fill="#ffffff" stroke="#d1d5db"/>
<line x1="90" y1="330.0" x2="560" y2="330.0" stroke="#eef2f7"/>
<text x="80.0" y="334.0" font-family="Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="end" font-weight="400">$0</text>
<line x1="90" y1="272.5" x2="560" y2="272.5" stroke="#eef2f7"/>
<text x="80.0" y="276.5" font-family="Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="end" font-weight="400">$22</text>
<line x1="90" y1="215.0" x2="560" y2="215.0" stroke="#eef2f7"/>
<text x="80.0" y="219.0" font-family="Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="end" font-weight="400">$43</text>
<line x1="90" y1="157.5" x2="560" y2="157.5" stroke="#eef2f7"/>
<text x="80.0" y="161.5" font-family="Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="end" font-weight="400">$65</text>
<line x1="90" y1="100.0" x2="560" y2="100.0" stroke="#eef2f7"/>
<text x="80.0" y="104.0" font-family="Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="end" font-weight="400">$86</text>
<rect x="195" y="124.6" width="118" height="205.4" fill="#111827" rx="6"/>
<text x="254.0" y="112.6" font-family="Arial, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">$76.93</text>
<text x="254.0" y="358.0" font-family="Arial, sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Original</text>
<rect x="400" y="180.4" width="118" height="149.6" fill="#0f766e" rx="6"/>
<text x="459.0" y="168.4" font-family="Arial, sans-serif" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">$56.04</text>
<text x="459.0" y="358.0" font-family="Arial, sans-serif" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Gated router</text>
<text x="600.0" y="125.0" font-family="Arial, sans-serif" font-size="16" fill="#111827" text-anchor="start" font-weight="700">Savings: $20.88</text>
<text x="600.0" y="155.0" font-family="Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="400">Cost reduction: 27.15%</text>
<text x="600.0" y="185.0" font-family="Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="400">Burden delta: -0.0089</text>
<text x="600.0" y="215.0" font-family="Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="400">Supported routes: 31.39%</text>
<text x="600.0" y="245.0" font-family="Arial, sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="400">Avg effective n: 32.4</text>
<text x="36.0" y="388.0" font-family="Arial, sans-serif" font-size="13" fill="#374151" text-anchor="start" font-weight="400">Interpretation: the gated policy spends less while the proxy quality moves slightly in the favorable direction.</text>
